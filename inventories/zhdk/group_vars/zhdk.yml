################################################################################
### global settings ############################################################
################################################################################

madek_support_email: "support.medienarchiv@zhdk.ch"



###############################################################################
### reverse proxy #############################################################
###############################################################################

reverse_proxy_use_x_forwarded_for: true


madek_virtual_hosts:
- hostname: "{{madek_external_hostname}}"
  ip: "*"
  ssl_certificate_file: '/etc/ssl/localcerts/{{ansible_host}}.crt'
  ssl_certificate_key_file: '/etc/ssl/localcerts/{{ansible_host}}.key'
  force_redirect_to_https: yes


reverse_proxy_custom_config: |

  ProxyPass /zhdk-agw  http://localhost:3333/zhdk-agw    nocanon retry=0
  ProxyPass /ext-auth/ms-oidc/zhdk http://localhost:3434/ext-auth/ms-oidc/zhdk  nocanon retry=1




###############################################################################
### storage settings ##########################################################
###############################################################################

madek_storage_dir: /opt/madekdata
madek_file_storage_dir: /opt/madekdata/attachments
madek_thumbnail_storage_dir: /opt/madekdata/attachments



###############################################################################
### database and db backups ###################################################
###############################################################################

db_backups_dir: "{{madek_storage_dir}}/backups"
restore_structure_and_data_file: "{{db_backups_dir}}/latest.pgbin"



###############################################################################
### transcoding settings ######################################################
###############################################################################


zencoder_api_key: "{{zhdk_zencoder_api_key}}"
zencoder_enabled: True


zencoder_video_output_formats:
  webm:
    {
      format: "webm",
      label: "webm",
      quality: 4,
      speed: 2,
      width: 620,
      thumbnails: true,
    }
  mp4: { format: "mp4", label: "mp4", video_codec: "h264", width: 620 }
  # minimum height for HD video targets videos where the higher size would increase the available size by 25%
  # worst normal case small preview height: 620 * 3/4 = 465
  # target min_size for HD: 620x465 * 1.25 = 775x581
  webm_HD:
    {
      format: "webm",
      label: "webm",
      quality: 4,
      speed: 2,
      height: 1080,
      skip: { min_size: "775x580" },
    }
  mp4_HD:
    {
      format: "mp4",
      label: "mp4",
      video_codec: "h264",
      height: 1080,
      skip: { min_size: "775x580" },
    }
  hls_360:
    {
      type: "segmented",
      format: "m4f",
      streaming_delivery_format: "hls",
      byte_range_segmenting: true,
      segment_seconds: 6,
      max_hls_protocol_version: 7,
      video_codec: "h264",
      h264_profile: "high",
      height: 360,
      max_frame_rate: 30,
      video_bitrate: 800,
      decoder_bitrate_cap: 1200,
      decoder_buffer_size: 3200,
      audio_codec: "aac",
      audio_bitrate: 128,
      audio_sample_rate: 48000,
      fixed_keyframe_interval: true,
      keyframe_rate: 0.5,
      generate_keyframe_manifest: true,
    }
  hls_720:
    {
      type: "segmented",
      format: "m4f",
      streaming_delivery_format: "hls",
      byte_range_segmenting: true,
      segment_seconds: 6,
      max_hls_protocol_version: 7,
      video_codec: "h264",
      h264_profile: "high",
      height: 720,
      video_bitrate: 3000,
      decoder_bitrate_cap: 4500,
      decoder_buffer_size: 12000,
      audio_codec: "aac",
      audio_bitrate: 128,
      audio_sample_rate: 48000,
      fixed_keyframe_interval: true,
      keyframe_rate: 0.5,
      generate_keyframe_manifest: true,
      skip: { min_size: "775x580" },
    }
  hls_1080:
    {
      type: "segmented",
      format: "m4f",
      streaming_delivery_format: "hls",
      byte_range_segmenting: true,
      segment_seconds: 6,
      max_hls_protocol_version: 7,
      video_codec: "h264",
      h264_profile: "high",
      height: 1080,
      video_bitrate: 6000,
      decoder_bitrate_cap: 9000,
      decoder_buffer_size: 24000,
      audio_codec: "aac",
      audio_bitrate: 128,
      audio_sample_rate: 48000,
      fixed_keyframe_interval: true,
      keyframe_rate: 0.5,
      generate_keyframe_manifest: true,
      skip: { min_size: "1280x720" },
    }
  hls:
    {
      type: "playlist",
      hls_protocol_version: 7,
      allow_skipped_sources: true,
      streams:
        [
          { source: "hls_360", path: "360.m3u8" },
          { source: "hls_720", path: "720.m3u8" },
          { source: "hls_1080", path: "1080.m3u8" },
        ],
    }

zencoder_audio_output_formats:
  vorbis: { format: "ogg", audio_codec: "vorbis", skip_video: true }
  mp3: { format: "mp3", audio_codec: "mp3", skip_video: true }



###############################################################################
### embed, html and css customization #########################################
###############################################################################


madek_webapp_embeds:
  enable_opengraph: true
  twitter_cards_site: "@zhdk"


# embed player logo (ZHdK)
madek_webapp_html_extra_head_end: |
  <style>
  {{ lookup('file', 'inventories/zhdk/files/logo-style-zhdk.css') }}
  </style>


